<div id="game-container">
<div class="flex flex-col min-h-full bg-tent-subtle">
    <!-- Header -->
    <header class="flex items-center justify-between p-3 circus-header">
        <button
            hx-post="/reset"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="circus-exit-btn">
            ← Exit
        </button>
        <h1 class="font-circus text-gold">Big Top Bingo</h1>
        <div class="w-16"></div>
    </header>

    <!-- Instructions -->
    <p class="circus-instruction">
        Find a performer who matches each square — tap to mark it!
    </p>

    <!-- Bingo indicator -->
    {% if session.has_bingo %}
    <div class="circus-spotlight">
        ★ BINGO! You've got a line! ★
    </div>
    {% endif %}

    <!-- Board -->
    <div class="flex-1 flex items-center justify-center p-3">
        {% include "components/bingo_board.html" %}
    </div>
</div>

{% if session.show_bingo_modal %}
    {% include "components/bingo_modal.html" %}
{% endif %}
</div>
