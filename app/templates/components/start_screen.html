<div id="game-container">
<div class="flex flex-col items-center justify-center min-h-full p-6 bg-tent-stripe">
    <div class="text-center max-w-sm circus-entrance">

        <div class="circus-divider mb-4">★ ★ ★</div>

        <h1 class="font-circus text-5xl text-gold-bright circus-title-glow mb-0">Big Top</h1>
        <h2 class="font-circus text-4xl text-cream circus-shadow-invert mb-3">BINGO</h2>
        <p class="text-xs text-cream mb-8" style="letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.75;">
            For Circus Performers
        </p>

        <div class="circus-placard rounded p-6 mb-8">
            <h3 class="font-circus text-crimson text-lg mb-3">How to Play</h3>
            <ul class="text-left text-dark-circus text-sm space-y-2">
                <li>🎪 Find fellow performers who match each square</li>
                <li>🎟️ Tap a square when you find your match</li>
                <li>⭐ Get 5 in a row to shout BINGO!</li>
            </ul>
        </div>

        <button
            hx-post="/start"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="circus-ticket-btn w-full">
            🎪 Step Right Up!
        </button>

    </div>
</div>
</div>
